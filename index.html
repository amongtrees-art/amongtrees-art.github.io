<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>among.trees.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;1,300&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece6d8;
  --ink:#2a2823;
  --muted:#7a7467;
  --line:#cfc7b4;
  --serif:'Spectral','Noto Serif KR',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background-color:var(--paper);color:var(--ink);
  font-family:var(--serif);font-weight:300;font-size:17px;line-height:1.8;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .22 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .02' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .13 0'/></filter><rect width='600' height='600' filter='url(%23f)'/></svg>");
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:44px 28px 80px}
header{display:flex;flex-direction:column;gap:22px;margin-bottom:56px}
.site{font-size:26px;font-weight:300;letter-spacing:.02em}
nav{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:15px}
nav a{color:var(--muted);padding:4px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
h1{font-weight:300;font-size:30px;line-height:1.3;margin:0 0 10px}
.intro{color:var(--muted);max-width:520px;margin:0 0 44px;font-size:15.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 30px}
.item{cursor:pointer}
.thumb{aspect-ratio:4/5;width:100%;background:var(--sw,#d8d0bd);overflow:hidden;box-shadow:0 1px 0 rgba(60,50,30,.12), 0 8px 18px -12px rgba(60,50,30,.35)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item h2{font-size:17px;font-weight:400;margin:14px 0 2px}
.item p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}
.masonry{display:block;columns:250px;column-gap:30px}
.masonry .item{break-inside:avoid;margin-bottom:38px}
.masonry .thumb{aspect-ratio:auto;height:auto}
.masonry .thumb:empty{aspect-ratio:4/5}
.masonry .thumb img{height:auto}
.about{max-width:560px}
.about p{margin:0 0 1.2em}
.about .contact{margin-top:2em;padding-top:1.2em;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.about a{border-bottom:1px solid var(--line)}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px;align-items:start;margin-bottom:68px}
.hero h2{font-size:22px;font-weight:300;margin:0 0 14px;line-height:1.4}
.hero p,.hero ul{font-size:14.5px}
.hero p{margin:0 0 1em;white-space:pre-line}
@media(min-width:701px){.hero p,.hero ul{font-size:min(14.5px,calc((100vw - 100px)*.0165))}.hero h2 + p{white-space:nowrap}}
.hero ul{list-style:none;margin:0 0 1.2em;padding:0;color:var(--muted)}
.hero li{margin:0 0 .2em}
.hero .spec{color:var(--muted);margin:0}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px}
.page{cursor:pointer}
.page .thumb{aspect-ratio:3/4}
#pop{position:fixed;z-index:8;width:300px;max-height:calc(100vh - 24px);overflow:hidden;background:#f2ecdf;padding:12px;box-shadow:0 18px 40px -14px rgba(40,32,18,.5);pointer-events:none;opacity:0;transform:scale(.97);transition:opacity .15s,transform .15s}
#pop.on{opacity:1;transform:none}
#pop .thumb{aspect-ratio:3/4;box-shadow:none}
#pop h3{font-size:15px;font-weight:400;margin:10px 0 2px}
#pop p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
#pop p,#lb p{white-space:pre-line}
.meta{margin:2px 0 8px;font-size:12.5px;line-height:1.6;color:var(--ink)}
.legend{margin-top:80px;padding-top:28px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px 36px}
.legend h3{font-size:13px;font-weight:400;color:var(--ink);margin:0 0 8px;letter-spacing:.02em}
.legend ul{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.9;color:var(--muted)}
.legend b{font-weight:400;color:var(--ink)}
.sq{display:inline-block;width:.8em;height:.8em;border:1.5px solid currentColor;box-sizing:border-box;vertical-align:-.05em}
.sq.f{background:currentColor}
.sq.h{background:linear-gradient(135deg,currentColor 50%,transparent 50%)}
@media(max-width:700px){.hero{grid-template-columns:1fr;gap:24px}}
#lb{position:fixed;inset:0;background:rgba(236,230,216,.96);display:none;align-items:center;justify-content:center;padding:28px;z-index:9;cursor:pointer}
#lb.on{display:flex}
#lb figure{margin:0;max-width:760px;width:100%;text-align:left;max-height:100%;overflow-y:auto}
#lb .big{width:100%;max-height:68vh;aspect-ratio:4/5;background:var(--sw,#d8d0bd);margin:0 auto;display:block;object-fit:contain}
#lb .big.sw{max-width:420px}
#lb h2{font-size:20px;font-weight:400;margin:16px 0 4px}
#lb p{margin:0;color:var(--muted);font-size:15px;max-width:560px}
footer{margin-top:90px;font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:560px){.wrap{padding:32px 20px 60px}.grid{grid-template-columns:repeat(2,1fr);gap:28px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="site" href="#about">among.trees.art</a>
    <nav id="nav"></nav>
  </header>
  <main id="main"></main>
  <footer>© among.trees.art</footer>
</div>
<div id="lb" role="dialog" aria-label="확대 보기"></div>
<div id="pop" aria-hidden="true"></div>

<script>
/* ============================================================
   여기만 고치면 돼요.
   1) 메뉴 이름·설명은 SECTIONS에서
   2) 작업 항목은 ITEMS에 한 줄씩 추가해요
      cat  : 어느 카테고리인지 (아래 id 중 하나)
      title: 제목
      note : 짧은 글
      img  : 사진 파일 이름 (index.html과 같은 곳에 올린 파일). 없으면 ""
      color: 사진이 없을 때 보이는 색 (예: "#7a8b5c")
   ============================================================ */
const SECTIONS = [
  {id:"about",   name:"About",             intro:""},
  {id:"studies", name:"Studies in Color",  intro:"색을 관찰하고 실험한 기록."},
  {id:"self",    name:"Self-Made Colors",  intro:"직접 만든 물감과 색."},
  {id:"archive", name:"Pigment Archive",   intro:""},
  {id:"use",     name:"Pigment in Use",    intro:"안료를 작업에 쓴 결과."}
];

const ABOUT = {
  text:[
    "어몽트리 아트는 물감과 종이를 직접 만들며 색을 연구하는 작업입니다.",
    "재료를 모으고, 안료로 만들고, 그림에 쓰는 과정을 이곳에 차곡차곡 기록합니다."
  ],
  contactHtml:'Instagram <a href="https://instagram.com/among.trees.art" target="_blank" rel="noopener">@among.trees.art</a><br>Email 이메일 주소를 여기에 적어주세요'
};

/* Pigment Archive 첫 화면의 노트 소개 (사진 + 글) */
const ARCHIVE_NOTE = {
  title:"Pigment & Color Material Archive",
  img:"pigment-archive-note.jpg",   // 노트 사진 파일 이름 (GitHub에 올린 이름과 같아야 해요)
  color:"#a89c80",
  text:[
    "수집한 안료를 발색하고, 각 안료의 종류와 특성을 기록한 아카이브 노트.",
    "안료의 분류를 비롯해 내광성, 투명도, 성분 등의 정보를 정리한다.\n각 안료에는 고유한 이름을 붙여 색을 기록한다.",
    "MSDS(물질안전보건자료)를 참고하여 인체와 환경에 유해성이 낮은 안료를 중심으로 선정한다."
  ],
  list:["수제 재생종이", "재사용 황마 자루", "면사를 이용한 콥틱 바인딩"],
  spec:"155 × 105 × 20 mm"
};

/* Pigment Archive의 cat:"archive" 항목은 노트의 '페이지'로 작게 나열돼요 */
const ITEMS = [
  {cat:"studies", title:"샘플 · 초록의 단계", note:"샘플 항목이에요. 지우고 내 작업으로 바꿔주세요.", img:"", color:"#8a9a6e"},
  {cat:"studies", title:"샘플 · 빛 아래 변하는 색", note:"사진 파일을 올리고 img에 파일 이름을 적으면 사진이 나와요.", img:"", color:"#b9a27a"},
  {cat:"self",    title:"샘플 · 밤나무 껍질 물감", note:"재료, 바인더, 만든 날짜를 짧게 적어보세요.", img:"", color:"#6b4f3a"},
  {cat:"self",    title:"샘플 · 쑥 물감", note:"", img:"", color:"#7d8b5a"},
  {cat:"archive", title:"엉겁의 존재", meta:["Pigment Red 102", "I  ◩  granulation", "천연무기안료"],
   note:"적철석을 주성분으로 하는 천연 산화철 안료.\n이탈리아 베네토 지역의 적토를 건조, 정제 후 분쇄.\n선사시대부터 사용된 인류 최초의 안료 중 하나.\n초기 르네상스 피렌체의 벽화에서 인물의 피부색 ‘cinabrese’를 만드는 데 사용됨.",
   img:"PR102_venetian red.jpg", color:"#a8483a"},
  {cat:"archive", title:"꽃가루 빛", meta:["Pigment Yellow 53", "I  ◩", "합성무기안료"],
   note:"니켈과 안티몬 이온이 치환된 루틸형 이산화티타늄 결정으로 이루어진 복합 금속 산화물 안료.\n고온 소성을 통해 제조, 열과 빛에 대한 안정성이 뛰어남.\n밝고 부드러운 녹황색을 띰",
   img:"PY53_Nickel-TitaniumYellow.jpg", color:"#d9cf6a"},
  {cat:"archive", title:"오후에 비타민", meta:["Pigment Yellow 83", "I  ◩  staining", "합성유기안료"],
   note:"두 개의 아조 결합을 포함하는 디아릴라이드 계열 안료.\n디아조화와 커플링 반응을 통해 합성, 물에 잘 녹지 않는 안정적 입자로 만들어짐.",
   img:"PY83_Diarylide Yellow.jpg", color:"#e8c93a"},
  {cat:"archive", title:"벨벳 하늘", meta:["Pigment Blue 71", "I  ◩  granulation", "합성무기안료"],
   note:"지르콘(ZrSiO₄) 결정 구조에 바나듐이 포함된 청색 안료.\n지르코늄 산화물, 실리카, 바나듐 산화물을 고온에서 소성.\n결정 구조가 매우 안정적.\n열, 빛, 화학적 환경에 대한 저항성이 높음.",
   img:"PB71_Zirconium Cerulean Blue.jpg", color:"#7fa9b8"},
  {cat:"archive", title:"벨벳 산호", meta:["Pigment Red 232", "I  ◩  granulation", "합성무기안료"],
   note:"규산지르코늄 결정 안에 카드뮴 황화물 및 셀렌화물 계열 색소 성분을 포함시킨 안료.\n고온 소성을 통해 제조, 색소 성분을 안정적인 결정 구조에 가둬 내열성과 내화학성이 높음.\n고온에서도 색이 잘 유지되는 혁신적 세라믹 안료로 개발됨.",
   img:"PR232_Zirconium Pink.jpg", color:"#d98a7e"},
  {cat:"archive", title:"명상의 시간", meta:["Pigment Green 23 (PW6 혼합 비율 12:1)", "I  □", "천연무기안료"],
   note:"프랑스 지역 녹색 흙에서 얻은 광물성 안료.\n철 함량이 낮고 점토 비율이 높아 밝고 부드러운 회녹빛을 띰.\n전통적으로 인물화의 밑칠이나 음영 표현에 사용됨.",
   img:"PG23_Terre Verte.jpg", color:"#9aa58a"},
  {cat:"archive", title:"개기일식", meta:["Pigment Black 11", "I  ■  granulation", "천연무기안료"],
   note:"프랑스 채석장에서 얻은 천연 흑색 철 산화물 안료.\n자철광(철 산화물)을 분쇄, 세척 후 정제함.\n철 산화물 안료는 인류 최초의 색 중 하나.",
   img:"PBk11_Black Ochre.jpg", color:"#3a3835"},
  {cat:"archive", title:"작열하는 온기", meta:["Pigment Red 3", "II  ◩  staining", "합성유기안료"],
   note:"모노아조 계열의 합성 유기 안료.\n두 가지 유기 화합물을 화학적으로 결합해 붉은색을 띠는 물질을 합성, 물에 잘 녹지 않는 성질을 이용해 안료로 만듦.\n20세기 초에 개발된 초기의 적색 합성유기안료 중 하나.",
   img:"PR3_Helio Red.jpg", color:"#c9382f"},
  {cat:"archive", title:"건자두", meta:["Pigment Red 102", "I  ■  granulation", "천연무기안료"],
   note:"미국 버지니아주 블루리지 산맥에서 채굴되는 천연 산화철 안료.\n적철석이 주요 발색 광물로, 일반적인 적색 산화철보다 보랏빛이 감도는 적자색과 갈색빛을 띰.",
   img:"PR102_Violet Ochre.jpg", color:"#7a4a52"},
  {cat:"archive", title:"붉어진 파랑", meta:["Pigment Blue 29", "I  ◩  granulation", "합성무기안료"],
   note:"고령토, 탄산나트륨, 황, 탄소 등을 혼합해 고온에서 구워 만듦.\n황 성분이 결정 구조 안에 포함되면서 특유의 청색을 띰.\n천연 라피스라줄리에서 얻는 값비싼 울트라마린을 대체하기 위해 1828년 프랑스에서 개발된 합성 안료.",
   img:"PB29_Ultramarine Blue.jpg", color:"#2f3f8f"},
  {cat:"archive", title:"양가감정", meta:["Pigment Purple 15 (PW6 혼합 비율 16:3)", "I  ◩", "합성무기안료"],
   note:"PB29와 같은 계열의 안료.\nPB29에 염화암모늄을 첨가 후 가열, 나트륨과 황 성분 일부가 변화하면서 보라색이 됨.",
   img:"PV15_Ultramarine Purple.jpg", color:"#6e4f8a"},
  {cat:"archive", title:"빛을 위한 돌", meta:["Pigment White 6", "I  ■", "합성무기안료"],
   note:"이산화티타늄으로 이루어진 백색 안료.\n루틸 광석을 화학적으로 정제, 고온에서 결정화한 뒤 분쇄.\n높은 굴절률로 빛을 강하게 산란시켜 뛰어난 은폐력과 백색도를 가짐.",
   img:"PW6_Titanium White Rutile.jpg", color:"#f3f0e8"},
  {cat:"archive", title:"금빛 사막", meta:["Pigment Yellow 43", "I  ◩  granulation", "천연무기안료"],
   note:"프랑스산 천연 황토에서 얻은 산화철 계열 안료.\n주 발색 성분은 침철석.\n실리카와 알루미나를 포함한 점토 광물 등으로 구성됨.\n선사시대부터 사용된 인류 최초의 색채 재료 중 하나.",
   img:"PY43_Yellow OChre.jpg", color:"#c99a3c"},
  {cat:"archive", title:"아기 청개구리", meta:["Pigment Green 17", "I  ■", "합성무기안료"],
   note:"주황색을 띠는 중크롬산염을 환원제와 함께 고온에서 반응시키면 녹색의 산화크롬이 형성됨.\n1809년 프랑스에서 개발, 뛰어난 내광성과 내열성, 화학적 안정성으로 건축용 도료와 산업용 안료로 사용됨.\n적외선을 흡수하는 특성으로 군용 위장 도료에도 활용됨.",
   img:"PG17_Chrome Oxide Green.jpg", color:"#5b7a4a"},
  {cat:"archive", title:"고려청자", meta:["Pigment Green 23", "I  □  granulation", "천연무기안료"],
   note:"프랑스 코트다쥐르 지역에서 채굴되는 셀라도나이트 광물 안료.\n현무암 같은 화산암이 물과 열수의 작용으로 변질되는 과정에서 철, 마그네슘, 칼륨 등을 포함한 규산염 광물로 형성됨.\n르네상스 회화에서 인물의 피부색을 표현하기 위한 밑칠 기법인 베르다치오(Verdaccio)에 사용된 전통적 녹색 흙 안료.",
   img:"PG23_Antique Green Earth_Celadonite.jpg", color:"#94a894"},
  {cat:"archive", title:"불편한 균형", meta:["Pigment Green 50", "I  ■", "합성무기안료"],
   note:"코발트와 티타늄 등의 금속 산화물을 고온에서 반응시켜 제조.\n금속 원소가 하나의 결정 구조 안에 결합된 복합 산화물 안료.\n높은 내광성과 내열성, 화학적 안정성을 지님.",
   img:"PG50_Cobalt Green.jpg", color:"#4f9a7e"},
  {cat:"archive", title:"공기 없는 숨", meta:["Pigment Green 26", "I  ■", "합성무기안료"],
   note:"산화코발트와 산화크롬을 고온에서 반응시켜 제조.\n두 금속 원료가 결합해 스피넬(spinel)이라는 안정적 결정 구조를 형성.\n높은 내광성과 내열성, 화학적 안정성이 특징.",
   img:"PG26_Cobalt Oxide Green Blue.jpg", color:"#3a8a8c"},
  {cat:"archive", title:"버터 가득 크로와상", meta:["Pigment Yellow 43", "I  ◩  granulation", "천연무기안료"],
   note:"프랑스산 천연 황갈색 산화철 안료.\n주요 발색 성분은 침철석. 망간 산화물과 점토, 실리카 등의 광분 성분이 포함됨.\n철과 망간의 함량 및 광물 조성에 따라 다양한 황갈색을 띰.\n[금빛 사막]보다 갈색과 붉은 기운이 강함.",
   img:"PY43_Raw Sienna.jpg", color:"#b9873f"},
  {cat:"archive", title:"잔열", meta:["Pigment Red 102", "I  ■  granulation", "천연무기안료"],
   note:"프랑스산 천연 황토인 PY43을 고온에서 가열해 제조.\n가열 과정에서 황색 광물인 침철석의 수분이 빠져나가고, 적색의 적철석으로 변화함.",
   img:"PR102_Burnt Sienna.jpg", color:"#8f4a2a"},
  {cat:"archive", title:"피스타치오 크림", meta:["Pigment Green 51", "I  ◩  granulation", "합성무기안료"],
   note:"칼슘 크롬 규산염 계열 안료.\n칼슘 산화물, 산화크롬, 이산화규소 등을 고온에서 소성하여 제조.\n산화크롬이 칼슘 규산염의 가넷형 구조에 포함된 상태.\n-산화크롬: 크롬을 함유한 산화물. 규산염과 결합하면서 특유의 녹색을 만듦.\n-규산염: 규소와 산소가 결합한 화합물. 칼슘과 함께 안정적인 결정 구조를 형성, 안료의 내구성과 화학적 안정성에 기여함.\n높은 내광성과 내열성을 지님.",

   img:"PY27_NTP-Yellow.jpg", color:"#e7c443"},
  {cat:"archive", title:"제주 귤밭", meta:["Pigment Yellow 216", "I  ■  staining", "합성무기안료"],
   note:"티타늄, 주석, 아연으로 이루어진 복합 산화물 안료.\n티타늄이 결정의 기본 골격을 이루며 루틸(rutile)이라는 광물 같은 형태의 구조를 형성.\n주석과 아연은 티타늄 결정 구조에 포함되어 안료의 색상과 특성에 영향을 줌.\n1980년 개발된 고성을 무기안료.\n기존 무기안료보다 선명한 주황색을 구현, 높은 내구성까지 갖춰 플라스틱, 산업용 코팅, 자동차 도료 등에 활용됨.\n높은 은폐력과 내광성, 안정성이 우수함.",

   img:"PR265_Cerium Red.jpg", color:"#b3342e"},
  {cat:"archive", title:"그늘진 추억", meta:["Pigment Brown 7", "I  ◩  granulation", "천연무기안료"],
   note:"철과 망간 성분이 풍부한 이탈리아산 흙 안료.\n산화철과 수산화철이 황갈색을 만들고, 자연적으로 포함된 망간 산화물이 색을 더욱 어둡고 차분하게 만듦.\n고대부터 사용된 전통적 흙 안료.\n르네상스와 바로크 시대 회화에서 그림자와 깊은 음영을 표현하는 데 사용됨.\n유화에서는 망간 성분이 기름의 건조를 촉진함.",

  {cat:"archive", title:"푸른 퇴적물", meta:["Pigment Blue 31", "I  ◩  granulation", "합성무기안료"],
   note:"석영(실리카), 구리 화합물, 석회 등을 고온에서 반응시켜 만든 칼슘 구리 규산염 안료.\n구리 성분이 포함된 결정 구조에서 특유의 선명한 청색이 나타남.\n고온에서 여러 원료를 소성해 푸른색의 결정 덩어리를 만들고, 이를 분쇄하여 안료로 사용.\n합성하여 만들어진 푸른 유기질 덩어리를 분쇄.\n기원전 3천년기부터 고대 이집트에서 사용된 인류 최초의 합성 안료 중 하나.\n입자가 매우 크고 무거워 물감으로 다루기 까다로움.",

  {cat:"archive", title:"나일강 침전물", meta:["Pigment Blue 31", "I  ◩  granulation", "합성무기안료"],
   note:"석영(실리카), 구리 원료, 석회 등을 고온에서 가열해 만든 구리 규산염 유리 안료.\n구리 성분을 포함한 유리질 구조에서 녹색과 청록색이 나타남.\n고대 이집트에서 로마 후기까지 사용, 중세 이후 제조법이 단절되었다가 현대에 복원됨.",

  {cat:"archive", title:"아스완 인디고", meta:["Natural Indigo", "천연유기염료"],
   note:"이집트 아스완 시장에서 구입한 천연 인디고 분말.\n인디고 분말은 염료로, 물에 녹지 않아 안료처럼 사용 가능.\n인디고 잎을 물에 담가 발효하면 잎 속의 색소 전구체가 인독실(Indoxyl)로 변함. 이를 공기에 산화시키면 물에 녹지 않는 파란 침전물이 생성됨. 침전물을 모아 건조하고 분쇄하여 분말로 만듦.\n입자 크기와 응집 상태에 따라 색의 농도가 달라짐.\n미세한 입자는 비교적 밝은 청색을, 큰 입자는 깊고 짙은 남색을 띰.",

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const LEGEND = [
  {title:"Transparency | 투명도", rows:[["□ Transparent","투명"],["◩ Semi-transparent","반투명"],["■ Opaque","불투명"]]},
  {title:"Lightfastness | 내광성", rows:[["I","매우 우수"],["II","우수"],["III","보통"]]},
  {title:"Granulation | 그래뉼레이션", rows:[["Granulation","입자 침전 및 과립감"]]},
  {title:"Staining | 착색성", rows:[["Staining","강한 착색, 제거 어려움"]]}
];
const sym = t => esc(t).replace(/□/g,'<span class="sq"></span>').replace(/◩/g,'<span class="sq h"></span>').replace(/■/g,'<span class="sq f"></span>');
const legendHtml = () => `<section class="legend">` + LEGEND.map(g =>
  `<div><h3>${esc(g.title)}</h3><ul>` + g.rows.map(r => `<li><b>${sym(r[0])}</b> — ${esc(r[1])}</li>`).join("") + `</ul></div>`).join("") + `</section>`;
const pop = $("#pop");
const metaHtml = it => it.meta ? `<div class="meta">${it.meta.map(sym).join("<br>")}</div>` : "";
function swatch(it){
  return `<div class="thumb" style="--sw:${esc(it.color||'#d8d0bd')}">${it.img?`<img src="${encodeURI(it.img)}" alt="${esc(it.title)}" onerror="this.remove()">`:''}</div>`;
}
function showPop(it, el){
  pop.innerHTML = swatch(it) + `<h3>${esc(it.title)}</h3>${metaHtml(it)}${it.note?`<p>${esc(it.note)}</p>`:''}`;
  pop.classList.add("on");
  const r = el.getBoundingClientRect(), w = 300, h = pop.offsetHeight;
  let x = r.right + 16;
  if(x + w > innerWidth - 12) x = r.left - w - 16;
  if(x < 12) x = Math.max(12, Math.min(r.left, innerWidth - w - 12));
  const y = Math.max(12, Math.min(r.top + r.height/2 - h/2, innerHeight - h - 12));
  pop.style.left = x + "px"; pop.style.top = y + "px";
}
function hidePop(){ pop.classList.remove("on"); }

function render(){
  const id = (location.hash || "#about").slice(1);
  const sec = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  $("#nav").innerHTML = SECTIONS.map(s =>
    `<a href="#${s.id}"${s.id===sec.id?' aria-current="page"':''}>${esc(s.name)}</a>`).join("");
  document.title = (sec.id==="about" ? "" : sec.name + " – ") + "among.trees.art";

  if(sec.id === "about"){
    $("#main").innerHTML = `<div class="about"><h1>About</h1>` +
      ABOUT.text.map(t => `<p>${esc(t)}</p>`).join("") +
      `<p class="contact">${ABOUT.contactHtml}</p></div>`;
    return;
  }
  const list = ITEMS.filter(i => i.cat === sec.id);

  if(sec.id === "archive"){
    $("#main").innerHTML = `<h1>${esc(sec.name)}</h1><p class="intro">${esc(sec.intro)}</p>
      <section class="hero">${swatch(ARCHIVE_NOTE)}
        <div><h2>${esc(ARCHIVE_NOTE.title)}</h2>${ARCHIVE_NOTE.text.map(t=>`<p>${esc(t)}</p>`).join("")}${ARCHIVE_NOTE.list?`<ul>${ARCHIVE_NOTE.list.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:''}${ARCHIVE_NOTE.spec?`<p class="spec">${esc(ARCHIVE_NOTE.spec)}</p>`:''}</div>
      </section>
      <div class="pages">` + list.map((it,n) =>
        `<div class="page" tabindex="0" data-n="${n}" aria-label="${esc(it.title)}">${swatch(it)}</div>`).join("") + `</div>` + legendHtml();
    document.querySelectorAll(".page").forEach(el => {
      const it = list[el.dataset.n];
      el.addEventListener("pointerenter", e => { if(e.pointerType === "mouse") showPop(it, el); });
      el.addEventListener("pointerleave", hidePop);
      el.addEventListener("focus", () => showPop(it, el));
      el.addEventListener("blur", hidePop);
      el.addEventListener("click", () => { hidePop(); openLb(it); });
      el.addEventListener("keydown", e => { if(e.key === "Enter") { hidePop(); openLb(it); } });
    });
    window.scrollTo(0,0);
    return;
  }
  $("#main").innerHTML = `<h1>${esc(sec.name)}</h1><p class="intro">${esc(sec.intro)}</p>` +
    `<div class="grid${sec.id==="use"?" masonry":""}">` + list.map((it, n) =>
      `<article class="item" tabindex="0" data-n="${n}">
        <div class="thumb" style="--sw:${esc(it.color||'#d8d0bd')}">${it.img?`<img src="${encodeURI(it.img)}" alt="${esc(it.title)}" loading="lazy">`:''}</div>
        <h2>${esc(it.title)}</h2>${it.note?`<p>${esc(it.note)}</p>`:''}
      </article>`).join("") + `</div>`;

  document.querySelectorAll(".item").forEach(el => {
    const open = () => openLb(list[el.dataset.n]);
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => { if(e.key==="Enter") open(); });
  });
  window.scrollTo(0,0);
}

function openLb(it){
  const media = it.img
    ? `<img class="big" src="${encodeURI(it.img)}" alt="${esc(it.title)}">`
    : `<div class="big sw" style="--sw:${esc(it.color||'#d8d0bd')}"></div>`;
  $("#lb").innerHTML = `<figure>${media}<h2>${esc(it.title)}</h2>${metaHtml(it)}${it.note?`<p>${esc(it.note)}</p>`:''}</figure>`;
  $("#lb").classList.add("on");
}
$("#lb").addEventListener("click", () => $("#lb").classList.remove("on"));
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#lb").classList.remove("on"); });
window.addEventListener("hashchange", render);
render();
</script>
